<!-- Floating Chat Widget -->
<div class="chat-widget" aria-label="Chat support options">
  <div class="chat-widget__buttons">
    <!-- Zalo Chat -->
    <a
      href="#"
      rel="noopener noreferrer"
      class="chat-widget__btn chat-widget__btn--zalo"
      aria-label="Chat qua Zalo"
    >
      <span
        class="iconify chat-widget__icon"
        data-icon="simple-icons:zalo"
        data-width="24"
        data-height="24"
      ></span>
      <span class="chat-widget__tooltip">Chat Zalo tư vấn</span>
    </a>

    <!-- AI Chat -->
    <a
      href="#"
      class="chat-widget__btn chat-widget__btn--ai"
      aria-label="AI Chat tư vấn 24/7"
    >
      <span
        class="iconify chat-widget__icon"
        data-icon="mdi:robot"
        data-width="24"
        data-height="24"
      ></span>
      <span class="chat-widget__tooltip">AI tư vấn 24/7</span>
    </a>

    <!-- Facebook Messenger -->
    <a
      href="https://m.me/YOUR_PAGE_ID"
      target="_blank"
      rel="noopener noreferrer"
      class="chat-widget__btn chat-widget__btn--messenger"
      aria-label="Chat qua Facebook Messenger"
    >
      <span
        class="iconify chat-widget__icon"
        data-icon="mdi:facebook-messenger"
        data-width="24"
        data-height="24"
      ></span>
      <span class="chat-widget__tooltip">Chat tư vấn tuyển sinh</span>
    </a>
  </div>

  <!-- Mobile toggle button -->
  <button
    class="chat-widget__toggle"
    aria-label="Mở menu chat"
    aria-expanded="false"
  >
    <span
      class="iconify chat-widget__toggle-icon chat-widget__toggle-icon--chat"
      data-icon="mdi:chat"
      data-width="28"
      data-height="28"
    ></span>
    <span
      class="iconify chat-widget__toggle-icon chat-widget__toggle-icon--close"
      data-icon="mdi:close"
      data-width="28"
      data-height="28"
    ></span>
  </button>
</div>
